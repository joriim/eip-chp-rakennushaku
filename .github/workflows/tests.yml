name: Testit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Asenna
        run: pip install -e .[test]
      - name: Yksikkö- ja rajapintatestit
        run: pytest -q
      - name: Laserkeilausmoduuli (Node)
        run: |
          npm install --no-save laz-perf@0.0.7
          node tests/js/test_lidar.js
      - name: Selain- ja Python-moottorin vastaavuus
        run: python web/check_equivalence.py
      - name: Selainversio on ajan tasalla
        run: |
          python web/build.py
          git diff --exit-code web/rakennushaku.html
