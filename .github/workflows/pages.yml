name: Julkaise selainversio (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/rakennushaku.html"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Kokoa sivu
        run: |
          mkdir -p _site
          cp web/rakennushaku.html _site/index.html
          cp src/rakennushaku/static/menetelmat.html _site/menetelmat.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
